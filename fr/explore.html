    <main class="legal-shell"><div class="container" style="padding-top:20px">
      <span class="eyebrow">Explorer</span><h1>Où partir pas cher en avion ?</h1>
      <p>Voyez les destinations les moins chères depuis votre aéroport. Changez le départ, fixez un budget et choisissez la durée du séjour.</p>
      <div class="ex-filters">
        <label>De <input id="exFrom" type="text" placeholder="Ville ou aéroport" autocomplete="off" /><ul class="pc-suggest" id="exSug" hidden></ul></label>
        <label>Prix maximum <span class="ex-range"><input id="exMax" type="range" min="30" max="600" step="10" value="600" /><b id="exMaxVal"></b></span></label>
        <label>Durée du séjour <select id="exLen"><option value="3">3 jours</option><option value="7" selected>7 jours</option><option value="14">14 jours</option></select></label>
      </div>
      <p id="exStatus" class="pc-legend"></p>
      <div class="ex-grid" id="exGrid"></div>
      <style>
        .ex-filters{display:flex;flex-wrap:wrap;gap:16px;margin:20px 0;align-items:end}.ex-filters label{display:grid;gap:4px;font-weight:700;font-size:.85rem;color:#4a3f66;position:relative}
        .ex-filters input[type=text],.ex-filters select{padding:12px;border:1px solid #d6cfe6;border-radius:10px;font:inherit;min-width:200px}.ex-range{display:flex;align-items:center;gap:10px}.ex-range input{width:180px;accent-color:#6b2fb5}.ex-range b{min-width:76px}
        .ex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;margin-bottom:30px}
        .ex-card{background:#fff;border-radius:22px;padding:8px;text-decoration:none;color:#1c1530;box-shadow:0 8px 24px rgba(40,10,90,.1);display:flex;flex-direction:column}
        .ex-card img{width:100%;aspect-ratio:3/2;object-fit:cover;border-radius:16px;background:#eee}.ex-card div{padding:10px 10px 8px;display:grid;gap:4px}
        .ex-card h3{margin:0}.ex-card p{margin:0;font-size:.85rem;color:#4a3f66}.ex-card strong{margin-top:10px;font-size:1.1rem}.ex-card:hover{transform:translateY(-2px)}.ex-card-fallback{min-height:130px;justify-content:center;border:1px solid #e4def2}.ex-card-fallback div{padding:18px}.ex-card-fallback strong{color:#6b2fb5}.ex-note{margin:0 0 22px;padding:14px 16px;border-radius:12px;background:#f0ebf8;color:#4a3f66}
        .pc-suggest{position:absolute;top:100%;left:0;right:0;z-index:30;margin:2px 0 0;padding:4px;list-style:none;background:#fff;border:1px solid #d6cfe6;border-radius:10px;box-shadow:0 10px 30px rgba(40,10,90,.18)}.pc-suggest li{padding:10px 12px;border-radius:8px;cursor:pointer}.pc-suggest li:hover{background:#f1ebff}
        @media(max-width:760px){.ex-filters{display:grid;grid-template-columns:1fr 1fr;align-items:end}.ex-filters label:first-child{grid-column:1/-1}.ex-filters input[type=text],.ex-filters select{min-width:0;width:100%;box-sizing:border-box}.ex-range input{width:100%;min-width:0}.ex-range{flex-wrap:wrap}.ex-grid{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}}
        @media(max-width:480px){.ex-filters{grid-template-columns:1fr}.ex-filters label:first-child{grid-column:auto}}
      </style>
